<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nihira's Computer Adventure Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf4f8;
  --bg2:#fbeaf2;
  --surface:#ffffff;
  --ink:#3a2a44;
  --muted:#8a7a94;
  --plum:#5b3b6e;
  --plum-deep:#4a2c5a;
  --pink:#e46595;
  --pink-soft:#fbdce8;
  --pink-line:#f3b9d1;
  --lav:#ede7f6;
  --lav-line:#d9cdec;
  --mint:#d8f0e6;
  --shadow:0 10px 30px rgba(91,59,110,.10);
  --shadow-sm:0 4px 14px rgba(91,59,110,.10);
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%, #fce8f1 0%, var(--bg) 45%);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:920px;margin:0 auto;padding:22px 18px 60px}

/* Header */
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.badge{
  font-family:"Fredoka",sans-serif;font-weight:600;letter-spacing:.5px;
  background:var(--plum);color:#fff;border-radius:999px;
  padding:8px 16px;font-size:14px;box-shadow:var(--shadow-sm);
}
.counter{margin-left:auto;color:var(--muted);font-weight:800;font-size:15px}
.counter b{color:var(--plum)}
.progress{height:10px;border-radius:999px;background:var(--lav);overflow:hidden;margin:6px 0 22px}
.progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),#f39ac0);border-radius:999px;transition:width .35s ease}

/* Card */
.card{
  background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);
  padding:30px 30px 26px;position:relative;overflow:hidden;
}
.eyebrow{
  display:inline-block;font-family:"Fredoka",sans-serif;font-weight:600;
  color:var(--pink);background:var(--pink-soft);border-radius:999px;
  padding:5px 14px;font-size:13px;letter-spacing:.4px;margin-bottom:14px;
}
.q{font-family:"Fredoka",sans-serif;font-weight:600;font-size:26px;line-height:1.25;color:var(--plum-deep);margin:0 0 6px}
.hint{color:var(--muted);font-size:16px;font-weight:600;margin:0 0 20px}

/* Buttons */
.nav{display:flex;gap:12px;margin-top:26px}
.btn{
  font-family:"Fredoka",sans-serif;font-weight:600;font-size:17px;cursor:pointer;
  border:none;border-radius:14px;padding:13px 24px;transition:transform .12s ease, box-shadow .12s ease, background .15s;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--pink);color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:#d9557f}
.btn-primary:disabled{background:#f0c6d8;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:var(--lav);color:var(--plum)}
.btn-ghost:hover{background:#e3daf1}
.btn-ghost:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.saved-tag{align-self:center;color:var(--muted);font-weight:800;font-size:14px;opacity:0;transition:opacity .3s}
.saved-tag.show{opacity:1}

/* MCQ */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;align-items:center;gap:14px;cursor:pointer;
  border:2px solid var(--lav-line);border-radius:16px;padding:16px 18px;
  font-size:18px;font-weight:700;background:#fff;transition:all .14s;
}
.opt:hover{border-color:var(--pink-line);background:#fff8fb}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--lav-line);flex:0 0 auto;transition:all .14s}
.opt.sel{border-color:var(--pink);background:#fff5f9}
.opt.sel .dot{background:var(--pink);border-color:var(--pink);box-shadow:inset 0 0 0 3px #fff}
.opt.multi .dot{border-radius:7px}
.opt.multi.sel .dot{box-shadow:inset 0 0 0 3px #fff}

/* Chips + drag */
.tray{display:flex;flex-wrap:wrap;gap:10px;padding:16px;background:var(--bg2);border-radius:16px;min-height:64px;margin-bottom:18px}
.tray.empty::after{content:"All placed!";color:var(--muted);font-weight:800;font-size:14px;margin:auto}
.chip{
  font-family:"Nunito";font-weight:800;font-size:15.5px;
  background:#fff;border:2px solid var(--lav-line);border-radius:12px;
  padding:11px 15px;cursor:grab;user-select:none;touch-action:none;
  box-shadow:0 2px 6px rgba(91,59,110,.08);transition:box-shadow .12s, transform .05s;
  display:inline-flex;align-items:center;gap:8px;color:var(--ink);
}
.chip:hover{box-shadow:0 4px 12px rgba(91,59,110,.16)}
.chip.dragging{opacity:.35}
.chip .grip{color:var(--lav-line);font-weight:900;letter-spacing:-1px}
.chip.floating{position:fixed;z-index:9999;pointer-events:none;box-shadow:0 12px 28px rgba(91,59,110,.28);transform:rotate(-2deg) scale(1.04);cursor:grabbing}

/* Bins */
.bins{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bin{border:2.5px dashed var(--lav-line);border-radius:18px;padding:14px;min-height:150px;background:#fff;transition:all .14s}
.bin.over{border-color:var(--pink);background:#fff5f9}
.bin h4{margin:2px 0 12px;font-family:"Fredoka";font-weight:600;font-size:17px;color:var(--plum);text-align:center;letter-spacing:.3px}
.bin .drop{display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;min-height:90px}

/* Order */
.slots{display:flex;flex-direction:column;gap:11px}
.slot{
  display:flex;align-items:center;gap:14px;border:2.5px dashed var(--lav-line);
  border-radius:15px;padding:10px 12px;min-height:58px;background:#fff;transition:all .14s;
}
.slot.over{border-color:var(--pink);background:#fff5f9}
.slot .num{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--plum);color:#fff;
  font-family:"Fredoka";font-weight:600;display:grid;place-items:center;font-size:17px;
}
.slot .holder{flex:1;display:flex}
.slot .holder .chip{width:100%;justify-content:flex-start;cursor:grab}

/* Order (reorderable list) */
.sortlist{display:flex;flex-direction:column;gap:11px}
.sortrow{width:100%;justify-content:flex-start;padding:13px 15px;font-size:16.5px;cursor:grab}
.sortrow.dragging{opacity:.35}
.sortrow .pos{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--plum);color:#fff;font-family:"Fredoka";font-weight:600;display:grid;place-items:center;font-size:16px;margin-right:2px}
.sortrow .steplabel{font-weight:800}

/* Match */
.rows{display:flex;flex-direction:column;gap:12px}
.mrow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.mrow .label{
  font-family:"Fredoka";font-weight:600;font-size:17px;color:var(--plum);
  background:var(--lav);border-radius:13px;padding:14px 16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:9px;min-height:56px;
}
.mrow .zone{border:2.5px dashed var(--lav-line);border-radius:13px;min-height:56px;display:flex;align-items:center;padding:8px;transition:all .14s}
.mrow .zone.over{border-color:var(--pink);background:#fff5f9}
.mrow .zone .chip{width:100%;justify-content:flex-start}

/* Tag (input/output buttons) */
.tagrows{display:flex;flex-direction:column;gap:12px}
.tagrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#fff;border:2px solid var(--lav-line);border-radius:15px;padding:12px 16px}
.tagrow .name{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}
.tagbtns{display:flex;gap:8px}
.tagbtn{font-family:"Fredoka";font-weight:600;font-size:15px;border:2px solid var(--lav-line);background:#fff;color:var(--muted);border-radius:11px;padding:9px 16px;cursor:pointer;transition:all .12s}
.tagbtn:hover{border-color:var(--pink-line)}
.tagbtn.on{background:var(--pink);color:#fff;border-color:var(--pink)}

/* Pick picture */
.picgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.piccard{border:2.5px solid var(--lav-line);border-radius:18px;padding:20px;background:#fff;cursor:pointer;display:grid;place-items:center;transition:all .14s;min-height:140px}
.piccard:hover{border-color:var(--pink-line);background:#fff8fb}
.piccard.sel{border-color:var(--pink);background:#fff5f9;box-shadow:var(--shadow-sm)}
.piccard svg{width:80px;height:80px}

/* Architecture (WhatsApp) */
.arch{position:relative;width:100%;max-width:560px;margin:0 auto 4px;aspect-ratio:1/.82}
.arch svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.aslot{
  position:absolute;transform:translate(-50%,-50%);
  border:2.5px dashed var(--lav-line);border-radius:14px;
  width:118px;height:56px;display:flex;align-items:center;justify-content:center;background:#fff;transition:all .14s;
}
.aslot.center{border-style:solid;border-color:var(--pink-line);width:132px;height:62px;background:#fff5f9}
.aslot.over{border-color:var(--pink);background:#fff0f6}
.aslot .chip{width:100%;height:100%;justify-content:center}

.icon{width:22px;height:22px;flex:0 0 auto}
.center-note{text-align:center;color:var(--muted);font-weight:700;font-size:14px;margin-top:2px}

/* Finish */
.finish{text-align:center;padding:20px 10px}
.finish .big{font-family:"Fredoka";font-weight:700;font-size:34px;color:var(--plum-deep);margin:10px 0 6px}
.star{font-size:56px}
.finish p{color:var(--muted);font-weight:700;font-size:17px;max-width:460px;margin:0 auto 22px}
.finish .btn{margin:6px}

@media(max-width:640px){
  .q{font-size:22px}
  .bins{grid-template-columns:1fr}
  .picgrid{grid-template-columns:1fr}
  .mrow{grid-template-columns:120px 1fr}
  .arch{max-width:360px}
  .aslot{width:92px;height:48px}
  .aslot.center{width:104px;height:54px}
  .chip{font-size:14px;padding:9px 12px}
}
.reset-mini{background:none;border:none;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer;text-decoration:underline;margin-top:12px}
.reset-mini:hover{color:var(--pink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="badge">Nihira's Computer Adventure</span>
    <span class="counter">Question <b id="cnum">1</b> / <span id="ctot">29</span></span>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div id="stage"></div>
  <div class="nav" id="nav">
    <button class="btn btn-ghost" id="back">Back</button>
    <span class="saved-tag" id="savedtag">✓ saved</span>
    <span class="spacer"></span>
    <button class="btn btn-primary" id="next">Next</button>
  </div>
</div>

<script>
/* ---------- ICONS (flat plum SVG) ---------- */
const P="#5b3b6e";
const IC={
  cpu:`<svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="6" y="6" width="12" height="12" rx="2" fill="${P}"/><g stroke="${P}" stroke-width="2" stroke-linecap="round"><path d="M9 3v3M12 3v3M15 3v3M9 18v3M12 18v3M15 18v3M3 9h3M3 12h3M3 15h3M18 9h3M18 12h3M18 15h3"/></g></svg>`,
  ram:`<svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4" fill="#f3e8fb"/><path d="M13 4l-6 8h4l-1 8 6-9h-4l1-7z" fill="${P}"/></svg>`,
  storage:`<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M3 8l9-4 9 4-9 4-9-4z" fill="${P}"/><path d="M3 8v3l9 4 9-4V8" stroke="${P}" stroke-width="2" fill="#f3e8fb"/></svg>`,
  server:`<svg class="icon" viewBox="0 0 24 24" fill="none"><g fill="${P}"><rect x="4" y="4" width="16" height="5" rx="1.5"/><rect x="4" y="10.5" width="16" height="5" rx="1.5"/><rect x="4" y="17" width="16" height="5" rx="1.5"/></g><g fill="#f39ac0"><circle cx="7" cy="6.5" r="1"/><circle cx="7" cy="13" r="1"/><circle cx="7" cy="19.5" r="1"/></g></svg>`,
  screen:`<svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="12" rx="2" fill="${P}"/><rect x="5" y="6" width="14" height="8" rx="1" fill="#f3e8fb"/><path d="M9 20h6M12 16v4" stroke="${P}" stroke-width="2" stroke-linecap="round"/></svg>`,
  keyboard:`<svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="12" rx="2.5" fill="${P}"/><g fill="#f3e8fb"><rect x="5" y="9" width="2" height="2" rx=".5"/><rect x="9" y="9" width="2" height="2" rx=".5"/><rect x="13" y="9" width="2" height="2" rx=".5"/><rect x="17" y="9" width="2" height="2" rx=".5"/><rect x="7" y="13" width="10" height="2" rx="1"/></g></svg>`,
  mouse:`<svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="7" y="3" width="10" height="18" rx="5" fill="${P}"/><rect x="11" y="6" width="2" height="4" rx="1" fill="#f39ac0"/></svg>`,
  mic:`<svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" fill="${P}"/><path d="M6 11a6 6 0 0012 0M12 17v4M9 21h6" stroke="${P}" stroke-width="2" stroke-linecap="round"/></svg>`,
  speaker:`<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M4 9h4l5-4v14l-5-4H4z" fill="${P}"/><path d="M16 8a5 5 0 010 8M18.5 6a8 8 0 010 12" stroke="#f39ac0" stroke-width="2" stroke-linecap="round"/></svg>`,
  printer:`<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M7 4h10v5H7z" fill="#f3e8fb" stroke="${P}" stroke-width="2"/><rect x="4" y="9" width="16" height="8" rx="2" fill="${P}"/><rect x="7" y="14" width="10" height="6" fill="#f3e8fb" stroke="${P}" stroke-width="2"/><circle cx="16.5" cy="12" r="1" fill="#f39ac0"/></svg>`,
  phone:`<svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="6" y="2" width="12" height="20" rx="3" fill="${P}"/><rect x="8" y="5" width="8" height="12" rx="1" fill="#f3e8fb"/><circle cx="12" cy="19.5" r="1" fill="#f39ac0"/></svg>`,
  globe:`<svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#f3e8fb" stroke="${P}" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" stroke="${P}" stroke-width="1.6"/></svg>`,
  app:`<svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4" fill="${P}"/><circle cx="12" cy="12" r="3.5" fill="#f39ac0"/></svg>`
};
function ico(n){return IC[n]||"";}

/* ---------- QUESTION DATA ---------- */
const Q=[
/* A1 build-arch */
{id:"a1",type:"arch",eyebrow:"Build it • from your homework",
 q:"People chatting on WhatsApp",hint:"Drag the boxes onto the map. Who belongs in the MIDDLE so everyone can talk?",
 chips:[{id:"server",label:"Server",icon:"server"},
        {id:"pa",label:"Person A",icon:"phone"},{id:"pb",label:"Person B",icon:"phone"},
        {id:"pc",label:"Person C",icon:"phone"},{id:"pd",label:"Person D",icon:"phone"},
        {id:"pe",label:"Person E",icon:"phone"},{id:"pf",label:"Person F",icon:"phone"}],
 centerCorrect:"server"},

/* A2 build-laptop (bins with frame) */
{id:"a2",type:"bins",eyebrow:"Build it",
 q:"Build a laptop",hint:"Hidden parts go INSIDE. Parts you can see and touch go OUTSIDE.",
 bins:[{key:"in",title:"🔧 Hidden inside"},{key:"out",title:"👀 You see & touch"}],
 chips:[{id:"cpu",label:"CPU",icon:"cpu"},{id:"ram",label:"RAM",icon:"ram"},{id:"sto",label:"Storage",icon:"storage"},
        {id:"kb",label:"Keyboard",icon:"keyboard"},{id:"scr",label:"Screen",icon:"screen"},{id:"tp",label:"Trackpad",icon:"mouse"}],
 answer:{cpu:"in",ram:"in",sto:"in",kb:"out",scr:"out",tp:"out"}},

/* A4 order: how app runs */
{id:"a4",type:"order",eyebrow:"Put in order",
 q:"How does an app run?",hint:"Drag the steps into the right order, top to bottom.",
 items:[{id:"s1",label:"App waits in Storage",icon:"storage"},
        {id:"s2",label:"App loads into RAM",icon:"ram"},
        {id:"s3",label:"CPU runs it",icon:"cpu"},
        {id:"s4",label:"You see it on the Screen",icon:"screen"}],
 order:["s1","s2","s3","s4"]},

/* A5 order: boot */
{id:"a5",type:"order",eyebrow:"Put in order",
 q:"Turning on a laptop",hint:"What happens first, second, third, last?",
 items:[{id:"b1",label:"Press the power button"},
        {id:"b2",label:"CPU wakes up",icon:"cpu"},
        {id:"b3",label:"Load from Storage",icon:"storage"},
        {id:"b4",label:"Desktop shows on Screen",icon:"screen"}],
 order:["b1","b2","b3","b4"]},

/* A6 order: press H */
{id:"a6",type:"order",eyebrow:"Put in order",
 q:"You press the H key",hint:"How does an 'H' end up on the screen? Order the steps.",
 items:[{id:"h1",label:"You press the H key",icon:"keyboard"},
        {id:"h2",label:"Signal goes to the CPU",icon:"cpu"},
        {id:"h3",label:"CPU tells the Screen",icon:"screen"},
        {id:"h4",label:"\"H\" appears on the Screen"}],
 order:["h1","h2","h3","h4"]},

/* A7 order: open photo */
{id:"a7",type:"order",eyebrow:"Put in order",
 q:"Opening a saved photo",hint:"Where does the photo travel? Put it in order.",
 items:[{id:"p1",label:"Photo waits in Storage",icon:"storage"},
        {id:"p2",label:"Photo loads into RAM",icon:"ram"},
        {id:"p3",label:"CPU shows it",icon:"cpu"},
        {id:"p4",label:"Screen displays it",icon:"screen"}],
 order:["p1","p2","p3","p4"]},

/* A8 order: send whatsapp */
{id:"a8",type:"order",eyebrow:"Put in order",
 q:"Sending a WhatsApp message",hint:"How does your message reach a far-away friend? Order it.",
 items:[{id:"w1",label:"You type the message",icon:"phone"},
        {id:"w2",label:"Your phone sends it out"},
        {id:"w3",label:"Server passes it along",icon:"server"},
        {id:"w4",label:"Friend's phone gets it",icon:"phone"},
        {id:"w5",label:"Friend reads it"}],
 order:["w1","w2","w3","w4","w5"]},

/* A9 order: download game */
{id:"a9",type:"order",eyebrow:"Put in order",
 q:"Downloading a game",hint:"From the internet to playing it — put the steps in order.",
 items:[{id:"g1",label:"You tap Download"},
        {id:"g2",label:"Server sends the game",icon:"server"},
        {id:"g3",label:"It saves into Storage",icon:"storage"},
        {id:"g4",label:"CPU installs it",icon:"cpu"},
        {id:"g5",label:"Ready to play!"}],
 order:["g1","g2","g3","g4","g5"]},

/* B5 bins input/output */
{id:"b5",type:"bins",eyebrow:"Sort them",
 q:"Input or Output?",hint:"Input = what YOU give. Output = what the computer gives back.",
 bins:[{key:"in",title:"⬅️ Input"},{key:"out",title:"➡️ Output"}],
 chips:[{id:"kb",label:"Keyboard",icon:"keyboard"},{id:"ms",label:"Mouse",icon:"mouse"},{id:"mic",label:"Microphone",icon:"mic"},
        {id:"scr",label:"Screen",icon:"screen"},{id:"spk",label:"Speaker",icon:"speaker"},{id:"pr",label:"Printer",icon:"printer"}],
 answer:{kb:"in",ms:"in",mic:"in",scr:"out",spk:"out",pr:"out"}},

/* B6 bins inside/outside */
{id:"b6",type:"bins",eyebrow:"Sort them",
 q:"Inside the laptop, or outside?",hint:"Which parts are hidden inside, and which do you use on the outside?",
 bins:[{key:"in",title:"Inside"},{key:"out",title:"Outside"}],
 chips:[{id:"cpu",label:"CPU",icon:"cpu"},{id:"ram",label:"RAM",icon:"ram"},{id:"sto",label:"Storage",icon:"storage"},
        {id:"kb",label:"Keyboard",icon:"keyboard"},{id:"ms",label:"Mouse",icon:"mouse"},{id:"scr",label:"Screen",icon:"screen"}],
 answer:{cpu:"in",ram:"in",sto:"in",kb:"out",ms:"out",scr:"out"}},

/* B7 bins hardware/software */
{id:"b7",type:"bins",eyebrow:"Sort them",
 q:"Hardware or Software?",hint:"Hardware = parts you can touch. Software = apps that live inside.",
 bins:[{key:"hw",title:"Hardware (touch it)"},{key:"sw",title:"Software (an app)"}],
 chips:[{id:"kb",label:"Keyboard",icon:"keyboard"},{id:"scr",label:"Screen",icon:"screen"},{id:"cpu",label:"CPU",icon:"cpu"},
        {id:"game",label:"Game app",icon:"app"},{id:"draw",label:"Drawing app",icon:"app"},{id:"web",label:"Web browser",icon:"globe"}],
 answer:{kb:"hw",scr:"hw",cpu:"hw",game:"sw",draw:"sw",web:"sw"}},

/* B8 bins ram/storage */
{id:"b8",type:"bins",eyebrow:"Sort them",
 q:"RAM or Storage?",hint:"RAM is quick but forgets. Storage keeps things forever.",
 bins:[{key:"ram",title:"RAM (quick, forgets)"},{key:"sto",title:"Storage (keeps forever)"}],
 chips:[{id:"c1",label:"Forgets when power is off"},{id:"c2",label:"Holds what you use right now"},{id:"c3",label:"The app open right now"},
        {id:"c4",label:"Keeps photos forever"},{id:"c5",label:"Stays when power is off"},{id:"c6",label:"Your saved games"}],
 answer:{c1:"ram",c2:"ram",c3:"ram",c4:"sto",c5:"sto",c6:"sto"}},

/* C9 pick RAM */
{id:"c9",type:"pick",eyebrow:"Spot it",
 q:"Which one is the RAM?",hint:"Remember — RAM was the quick lightning memory.",
 options:[{id:"ram",icon:"ram"},{id:"storage",icon:"storage"},{id:"server",icon:"server"},{id:"screen",icon:"screen"}],
 correct:"ram"},

/* C10 pick CPU */
{id:"c10",type:"pick",eyebrow:"Spot it",

function persist(){try{localStorage.setItem(KEY,JSON.stringify(answers));}catch(e){}}
function flashSaved(){const t=document.getElementById("savedtag");t.classList.add("show");clearTimeout(flashSaved._t);flashSaved._t=setTimeout(()=>t.classList.remove("show"),1200);}

/* ---------- DRAG ENGINE (pointer based, mouse+touch) ---------- */
let drag=null;
function makeDraggable(chip){
  chip.addEventListener("pointerdown",e=>{
    if(e.button!==undefined && e.button!==0) return;
    e.preventDefault();
    const rect=chip.getBoundingClientRect();
    const ghost=chip.cloneNode(true);
    ghost.classList.add("floating");
    ghost.style.width=rect.width+"px";
    ghost.style.left=rect.left+"px";
    ghost.style.top=rect.top+"px";
    document.body.appendChild(ghost);
    chip.classList.add("dragging");
    drag={chip,ghost,origin:chip.parentElement,dx:e.clientX-rect.left,dy:e.clientY-rect.top,overEl:null};
    chip.setPointerCapture&&chip.setPointerCapture(e.pointerId);
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",onUp,{once:true});
  });
}
function onMove(e){
  if(!drag)return;
  drag.ghost.style.left=(e.clientX-drag.dx)+"px";
  drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  drag.ghost.style.display="none";
  const el=document.elementFromPoint(e.clientX,e.clientY);
  drag.ghost.style.display="";
  const zone=el&&el.closest?el.closest(".dropzone"):null;
  if(drag.overEl&&drag.overEl!==zone)drag.overEl.classList.remove("over");
  if(zone){zone.classList.add("over");drag.overEl=zone;}
  else drag.overEl=null;
}
function onUp(e){
  if(!drag)return;
  window.removeEventListener("pointermove",onMove);
  const zone=drag.overEl;
  if(zone){
    zone.classList.remove("over");
    placeChip(drag.chip,zone,drag.origin);
  }
  drag.chip.classList.remove("dragging");
  drag.ghost.remove();
  drag=null;
}
/* placeChip: honor single-holder zones (swap), multi zones (append).
   Chips land in an inner .holder/.drop if the visible dropzone has one. */
function holderOf(zone){return zone.querySelector(":scope > .holder, :scope > .drop")||zone;}
function placeChip(chip,zone,origin){
  const h=holderOf(zone);
  if(zone.classList.contains("single")){
    const existing=h.querySelector(".chip");
    if(existing&&existing!==chip) origin.appendChild(existing);
    h.appendChild(chip);
  }else{
    h.appendChild(chip);
  }
  currentOnChange&&currentOnChange();
}
let currentOnChange=null;

/* ---------- RENDER HELPERS ---------- */
function chipEl(c){
  const d=document.createElement("div");
  d.className="chip";d.dataset.id=c.id;
  d.innerHTML=(c.icon?ico(c.icon):"")+"<span class='grip'>⠿</span>"+c.label;
  makeDraggable(d);
  return d;
}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

/* ---------- RENDERERS ---------- */
function render(){
  const q=Q[idx];
  document.getElementById("cnum").textContent=idx+1;
  document.getElementById("bar").style.width=((idx)/(Q.length-1)*100)+"%";
  const stage=document.getElementById("stage");
  stage.innerHTML="";
  currentOnChange=null;
  document.getElementById("nav").style.display="flex";

  if(q.type==="finish"){renderFinish(stage);return;}

  const card=el("div","card");
  card.appendChild(el("span","eyebrow",q.eyebrow||""));
  card.appendChild(el("h2","q",q.q));
  if(q.hint)card.appendChild(el("p","hint",q.hint));
  const body=el("div");card.appendChild(body);
  stage.appendChild(card);

  ({mcq:rMCQ,multi:rMulti,bins:rBins,order:rOrder,arch:rArch,pick:rPick,match:rMatch,tag:rTag})[q.type](q,body);

  // reset link for interactive types
  if(["bins","order","arch","match"].includes(q.type)){
    const rl=el("button","reset-mini","↺ start this one over");
    rl.onclick=()=>{delete answers[q.id];persist();render();};

  updateNav();
}

/* MCQ single */
function rMCQ(q,body){
  const wrap=el("div","opts");
  const cur=answers[q.id]&&answers[q.id].pick;
  q.options.forEach(o=>{
    const d=el("div","opt"+(cur===o.id?" sel":""));
    d.innerHTML="<span class='dot'></span><span>"+o.label+"</span>";
    d.onclick=()=>{
      answers[q.id]={pick:o.id,correct:!!o.correct};
      persist();flashSaved();
      [...wrap.children].forEach(c=>c.classList.remove("sel"));
      d.classList.add("sel");updateNav();
    };
    wrap.appendChild(d);
  });
  body.appendChild(wrap);
}

/* Multi select */
function rMulti(q,body){
  const wrap=el("div","opts");
  const cur=(answers[q.id]&&answers[q.id].picks)||[];
  q.options.forEach(o=>{
    const on=cur.includes(o.id);
    const d=el("div","opt multi"+(on?" sel":""));
    d.innerHTML="<span class='dot'></span><span>"+o.label+"</span>";
    d.onclick=()=>{
      d.classList.toggle("sel");
      const picks=[...wrap.querySelectorAll(".opt.sel")].map(x=>x.dataset.oid);
      const allCorrect=q.options.every(op=>picks.includes(op.id)===!!op.correct);
      answers[q.id]={picks,correct:allCorrect};
      persist();flashSaved();updateNav();
    };
    d.dataset.oid=o.id;
    wrap.appendChild(d);
  });
  body.appendChild(wrap);
}

/* Bins */
function rBins(q,body){
  const tray=el("div","tray dropzone");tray.dataset.zone="tray";
  const grid=el("div","bins");
  const zones={};
  q.bins.forEach(b=>{
    const bin=el("div","bin dropzone");bin.dataset.zone=b.key;
    bin.appendChild(el("h4",null,b.title));
    const drop=el("div","drop");
    bin.appendChild(drop);
    zones[b.key]=drop;
    grid.appendChild(bin);
  });
  body.appendChild(tray);body.appendChild(grid);

  // restore or fresh
  const saved=answers[q.id]&&answers[q.id].place;
  q.chips.forEach(c=>{
    const ch=chipEl(c);
    const where=saved&&saved[c.id];
    (where&&zones[where]?zones[where]:tray).appendChild(ch);
  });
  syncTrayEmpty(tray);

  currentOnChange=function(){
    const place={};let allPlaced=true;
    q.chips.forEach(c=>{
      const ch=body.querySelector(".chip[data-id='"+c.id+"']");
      const z=ch.closest(".dropzone").dataset.zone;
      if(z==="tray"){allPlaced=false;place[c.id]=null;}else place[c.id]=z;
    });
    let correct=allPlaced&&q.chips.every(c=>place[c.id]===q.answer[c.id]);
    answers[q.id]={place,done:allPlaced,correct};
    persist();flashSaved();syncTrayEmpty(tray);updateNav();
  };
}
function syncTrayEmpty(tray){tray.classList.toggle("empty",!tray.querySelector(".chip"));}

/* Order — reorder a single list, no separate slots */
function rOrder(q,body){
  const list=el("div","sortlist");
  const saved=answers[q.id]&&answers[q.id].orderIds;
  let ids;
  if(saved) ids=saved.slice();
  else if(q.preset) ids=q.preset.slice();
  else ids=shuffle(q.items.map(i=>i.id));
  ids=ids.filter(id=>q.items.find(i=>i.id===id));
  q.items.forEach(i=>{if(!ids.includes(i.id))ids.push(i.id);});

  ids.forEach(id=>{
    const it=q.items.find(x=>x.id===id);
    const row=el("div","chip sortrow");row.dataset.id=id;
    row.innerHTML="<span class='pos'></span>"+(it.icon?ico(it.icon):"")+"<span class='grip'>⠿</span><span class='steplabel'>"+it.label+"</span>";
    makeSortDrag(row,list,commit);
    list.appendChild(row);
  });
  body.appendChild(list);
  renumber(list);

  function commit(touched){
    renumber(list);
    const order=[...list.querySelectorAll(".sortrow")].map(r=>r.dataset.id);
    const correct=q.order.every((id,i)=>order[i]===id);
    const prev=answers[q.id];
    const done=touched?true:(prev?prev.done:false);
    answers[q.id]={orderIds:order,done,correct};
    persist();if(touched)flashSaved();updateNav();
  }
  // record starting arrangement (not yet 'done' until she moves something)
  commit(false);
}

/* pointer-based reorder within one list */
function makeSortDrag(row,list,onChange){
  row.addEventListener("pointerdown",e=>{
    if(e.button!==undefined&&e.button!==0)return;
    e.preventDefault();
    const rect=row.getBoundingClientRect();
    const ghost=row.cloneNode(true);ghost.classList.add("floating");
    ghost.style.width=rect.width+"px";ghost.style.left=rect.left+"px";ghost.style.top=rect.top+"px";
    document.body.appendChild(ghost);
    row.classList.add("dragging");
    const dx=e.clientX-rect.left,dy=e.clientY-rect.top;
    row.setPointerCapture&&row.setPointerCapture(e.pointerId);
    function move(ev){
      ghost.style.left=(ev.clientX-dx)+"px";ghost.style.top=(ev.clientY-dy)+"px";
      ghost.style.display="none";
      const under=document.elementFromPoint(ev.clientX,ev.clientY);
      ghost.style.display="";
      const over=under&&under.closest?under.closest(".sortrow"):null;
      if(over&&over!==row){
        const r=over.getBoundingClientRect();
        const before=ev.clientY < r.top+r.height/2;
        list.insertBefore(row,before?over:over.nextSibling);
        renumber(list);
      }else if(under&&under.closest&&under.closest(".sortlist")&&!over){
        list.appendChild(row);renumber(list);
      }
    }
    function up(){
      window.removeEventListener("pointermove",move);
      row.classList.remove("dragging");ghost.remove();
      onChange&&onChange(true);
    }
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",up,{once:true});
  });
}
function renumber(list){[...list.querySelectorAll(".sortrow")].forEach((r,i)=>{const p=r.querySelector(".pos");if(p)p.textContent=i+1;});}

/* Architecture (WhatsApp) */
function rArch(q,body){
  const tray=el("div","tray dropzone");tray.dataset.zone="tray";
  body.appendChild(tray);
  const arch=el("div","arch");
  // outer positions (percent) around center
  const pos=[[18,20],[50,12],[82,20],[18,80],[50,88],[82,80]];
  // SVG lines from each outer to center
  let lines="";
  pos.forEach(p=>{lines+=`<line x1="${p[0]}" y1="${p[1]}" x2="50" y2="50" stroke="#d9cdec" stroke-width="1.4"/>`;});
  arch.innerHTML=`<svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>`;
  // center slot
  const center=el("div","aslot center dropzone single");center.dataset.zone="center";
  center.style.left="50%";center.style.top="50%";
  arch.appendChild(center);
  const outerZones=[];
  pos.forEach((p,i)=>{
    const s=el("div","aslot dropzone single");s.dataset.zone="out"+i;
    s.style.left=p[0]+"%";s.style.top=p[1]+"%";
    arch.appendChild(s);outerZones.push(s);
  });
  body.appendChild(arch);
  body.appendChild(el("div","center-note","💡 One box sits in the middle so everyone can reach it."));

  const saved=answers[q.id]&&answers[q.id].place;
  const chipmap={};
  q.chips.forEach(c=>{chipmap[c.id]=chipEl(c);});
  if(saved){
    q.chips.forEach(c=>{
      const z=saved[c.id];
      let target=tray;
      if(z==="center")target=center;
      else if(z&&z.startsWith("out"))target=outerZones[+z.slice(3)];
      target.appendChild(chipmap[c.id]);
    });
  }else{
    shuffle(q.chips.slice()).forEach(c=>tray.appendChild(chipmap[c.id]));
  }
  syncTrayEmpty(tray);

  currentOnChange=function(){
    const place={};let placed=0;
    q.chips.forEach(c=>{
      const ch=body.querySelector(".chip[data-id='"+c.id+"']");
      const z=ch.closest(".dropzone").dataset.zone;
      place[c.id]=z;if(z!=="tray")placed++;
    });
    const done=placed===q.chips.length;
    const centerId=Object.keys(place).find(k=>place[k]==="center");
    const correct=done&&centerId===q.centerCorrect;
    answers[q.id]={place,done,correct};
    persist();flashSaved();syncTrayEmpty(tray);updateNav();
  };
}

/* Pick picture */
function rPick(q,body){
  const grid=el("div","picgrid");
  const cur=answers[q.id]&&answers[q.id].pick;
  shuffle(q.options.slice()).forEach(o=>{
    const c=el("div","piccard"+(cur===o.id?" sel":""));
    c.innerHTML=ico(o.icon);
    c.onclick=()=>{
      answers[q.id]={pick:o.id,correct:o.id===q.correct};
      persist();flashSaved();
      [...grid.children].forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel");updateNav();
    };
    grid.appendChild(c);

/* Match: drag job chips onto rows */
function rMatch(q,body){
  const tray=el("div","tray dropzone");tray.dataset.zone="tray";
  body.appendChild(tray);
  const rows=el("div","rows");
  const zoneEls={};
  q.rows.forEach(r=>{
    const row=el("div","mrow");
    row.appendChild(el("div","label",(r.icon?ico(r.icon):"")+r.label));
    const z=el("div","zone dropzone single");z.dataset.zone=r.id;
    row.appendChild(z);rows.appendChild(row);zoneEls[r.id]=z;
  });
  body.appendChild(rows);

  const saved=answers[q.id]&&answers[q.id].place;
  const chipmap={};
  q.chips.forEach(c=>{chipmap[c.id]=chipEl(c);});
  if(saved){
    q.chips.forEach(c=>{const z=saved[c.id];(z&&z!=="tray"&&zoneEls[z]?zoneEls[z]:tray).appendChild(chipmap[c.id]);});
  }else{
    shuffle(q.chips.slice()).forEach(c=>tray.appendChild(chipmap[c.id]));
  }
  syncTrayEmpty(tray);

  currentOnChange=function(){
    const place={};let placed=0;
    q.chips.forEach(c=>{
      const ch=body.querySelector(".chip[data-id='"+c.id+"']");
      const z=ch.closest(".dropzone").dataset.zone;
      place[c.id]=z;if(z!=="tray")placed++;
    });
    const done=placed===q.chips.length;
    const correct=done&&q.chips.every(c=>place[c.id]===c.row);
    answers[q.id]={place,done,correct};
    persist();flashSaved();syncTrayEmpty(tray);updateNav();
  };
}

/* Tag: input/output buttons per row */
function rTag(q,body){
  const wrap=el("div","tagrows");
  const cur=(answers[q.id]&&answers[q.id].tags)||{};
  q.rows.forEach(r=>{
    const row=el("div","tagrow");
    row.appendChild(el("div","name",(r.icon?ico(r.icon):"")+r.label));
    const btns=el("div","tagbtns");
    q.tags.forEach(t=>{
      const b=el("button","tagbtn"+(cur[r.id]===t?" on":""),t);
      b.onclick=()=>{
        cur[r.id]=t;
        [...btns.children].forEach(x=>x.classList.remove("on"));
        b.classList.add("on");
        const done=q.rows.every(rr=>cur[rr.id]);
        const correct=done&&q.rows.every(rr=>cur[rr.id]===rr.correct);
        answers[q.id]={tags:{...cur},done,correct};
        persist();flashSaved();updateNav();
      };
      btns.appendChild(b);
    });
    row.appendChild(btns);
    wrap.appendChild(row);
  });
  body.appendChild(wrap);
}

/* ---------- FINISH ---------- */
function renderFinish(stage){
  const card=el("div","card");
  const total=Q.length;
  const done=Q.filter(q=>isAnswered(q)).length;
  card.innerHTML=`<div class="finish">
    <div class="star">🌟</div>
    <div class="big">Amazing work, Nihira!</div>
    <p>You finished all ${total} questions. You answered ${done} of them. High five! ✋</p>
  </div>`;
  const f=card.querySelector(".finish");
  const dl=el("button","btn btn-primary","Download results (for the teacher)");
  dl.onclick=downloadResults;
  const rev=el("button","btn btn-ghost","Go back and review");
  rev.onclick=()=>{idx=Q.length-1;render();};
  f.appendChild(dl);f.appendChild(rev);
  stage.appendChild(card);
  document.getElementById("bar").style.width="100%";
  document.getElementById("nav").style.display="none";
}

function isAnswered(q){
  const a=answers[q.id];if(!a)return false;
  if(q.type==="mcq"||q.type==="pick")return !!a.pick;
  if(q.type==="multi")return Array.isArray(a.picks)&&a.picks.length>0;
  return !!a.done;
}

/* ---------- NAV ---------- */
function updateNav(){
  const q=Q[idx];
  document.getElementById("back").disabled=idx===0;
  const nx=document.getElementById("next");
  nx.textContent=idx===Q.length-1?"Finish ✓":"Next";
  // allow moving on even if unanswered (no forcing), but nudge: keep enabled
  nx.disabled=false;
}
document.getElementById("back").onclick=()=>{if(idx>0){idx--;render();}};
document.getElementById("next").onclick=()=>{
  if(idx<Q.length-1){idx++;render();}
  else{ // finish screen
    const stage=document.getElementById("stage");stage.innerHTML="";renderFinish(stage);
  }
};

/* ---------- RESULTS EXPORT ---------- */
function downloadResults(){
  let lines=["NIHIRA — COMPUTER ADVENTURE TEST — RESULTS","Generated: "+new Date().toLocaleString(),""];
  let correctCount=0,answeredCount=0;
  Q.forEach((q,i)=>{
    const a=answers[q.id];
    let ans="(not answered)",ok="—";
    if(a){
      answeredCount++;
      if(q.type==="mcq"||q.type==="pick"){
        ans=labelFor(q,a.pick);ok=a.correct?"CORRECT":"wrong";
      }else if(q.type==="multi"){
        ans=(a.picks||[]).map(p=>labelFor(q,p)).join(", ");ok=a.correct?"CORRECT":"wrong";
      }else if(q.type==="tag"){
        ans=Object.entries(a.tags||{}).map(([k,v])=>rowLabel(q,k)+"="+v).join(", ");ok=a.correct?"CORRECT":"wrong";
      }else{ // placement types
        ans=describePlace(q,a);ok=a.correct?"CORRECT":(a.done?"wrong":"incomplete");
      }
      if(a.correct)correctCount++;
    }
    lines.push(`Q${i+1}. [${q.type}] ${q.q}`);
    lines.push(`    Answer: ${ans}`);
    lines.push(`    Result: ${ok}`);
    lines.push("");
  });
  lines.splice(3,0,`Score (teacher only): ${correctCount} correct / ${Q.length}  •  Answered: ${answeredCount}`,"");
  const blob=new Blob([lines.join("\n")],{type:"text/plain"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="nihira_test_results.txt";a.click();
  URL.revokeObjectURL(url);
}
function labelFor(q,id){const o=(q.options||[]).find(x=>x.id===id);return o?o.label:id;}
function rowLabel(q,id){const r=(q.rows||[]).find(x=>x.id===id);return r?r.label:id;}
function describePlace(q,a){
  if(q.type==="order"){
    return (a.orderIds||[]).map((id,i)=>(i+1)+"."+itemLabel(q,id)).join("  ");
  }
  if(q.type==="arch"){
    const c=Object.keys(a.place||{}).find(k=>a.place[k]==="center");
    return "Center = "+(c?chipLabel(q,c):"empty");
  }
  // bins / match
  return Object.entries(a.place||{}).filter(([,z])=>z&&z!=="tray").map(([id,z])=>chipLabel(q,id)+"→"+z).join(", ");
}
function itemLabel(q,id){const it=(q.items||[]).find(x=>x.id===id);return it?it.label:id;}
function chipLabel(q,id){const c=(q.chips||[]).find(x=>x.id===id);return c?c.label:id;}

/* ---------- UTIL ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

render();
